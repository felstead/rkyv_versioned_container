[package]
name = "rkyv_versioned_derive"
description = "Derive macro for the rkyv_versioned crate's versioned archive containers"
readme = "README.md"
keywords = ["rkyv", "serialization", "versioning", "derive", "macro"]
categories = ["encoding", "development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
proc-macro2 = "1.0.87"
quote = "1.0.37"
syn = "2.0.79"

[lib]
proc-macro = true
