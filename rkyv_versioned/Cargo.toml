[package]
name = "rkyv_versioned"
description = "Versioned containers for rkyv archives, giving zero-copy access to data written by older and newer versions of your code"
readme = "README.md"
keywords = ["rkyv", "serialization", "versioning", "zero-copy", "archive"]
categories = ["encoding", "data-structures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
const-crc32 = "1.3.0"
# 0.8.7 dropped a lifetime parameter from HighSerializer, which our serializer bounds rely on
rkyv = "0.8.7"
rkyv_versioned_derive = { path = "../rkyv_versioned_derive", version = "0.2.0" }
